name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/configure-pages@v5

      - run: pnpm install

      - name: Build clinical-tool
        run: pnpm --filter @workspace/clinical-tool run build
        env:
          BASE_PATH: /Clinical_IQ/

      - uses: actions/upload-pages-artifact@